name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --frozen --extra dev

      - name: Doctor
        run: uv run paperflow doctor

      - name: CLI
        run: |
          uv run paperflow --version
          uv run paperflow --help

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Build neutral example
        run: uv run paperflow build
